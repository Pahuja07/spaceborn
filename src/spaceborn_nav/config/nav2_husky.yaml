# Nav2 parameters for the Clearpath Husky A200 running RTAB-Map SLAM.
#
# Differences from the stock nav2_params.yaml, all forced by this robot:
#   * No AMCL and no map_server -- RTAB-Map owns map->odom and publishes /map.
#     Only navigation_launch.py is started, never localization_launch.py.
#   * No lidar. The single obstacle source is a laser scan synthesised from the
#     RealSense depth image by depthimage_to_laserscan. It only sees a ~72 deg
#     wedge in front of the robot, so the costmaps keep obstacles longer than a
#     360 deg robot would, and reversing behaviours are kept short.
#   * Frames are un-namespaced (base_link / odom / map). The a200_0000 namespace
#     applies to topics only -- robot_state_publisher runs without frame_prefix.
#   * Footprint is the real A200 body (0.99 x 0.67 m) plus bumpers, not a radius.
#
# navigation_launch.py re-roots this file under the robot namespace via
# RewrittenYaml, so node names here must stay un-namespaced.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # Generous: SLAM pose can jump on loop closure and that must not count as failure.
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Frontier goals sit on the edge of known space -- being close is enough,
      # and the final heading does not matter for exploration.
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.60

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: -0.15
      min_vel_y: 0.0
      max_vel_x: 0.40
      max_vel_y: 0.0
      max_vel_theta: 0.25
      min_speed_xy: 0.0
      # Matched to numpad_teleop (linear_speed 0.4 m/s, angular_speed 0.25 rad/s)
      # so autonomous driving is no faster than what the visual odometry was
      # proven to survive under manual control.
      max_speed_xy: 0.40
      # Must stay well below max_vel_theta or DWB prunes every pure-rotation
      # trajectory except one at exactly the maximum, making turns all-or-nothing.
      min_speed_theta: 0.05
      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.5
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.5
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 30
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.35
      # Threshold for "the robot has stopped translating", not a speed limit.
      # At 0.25 it equalled max_vel_theta, so RotateToGoal could engage while
      # the robot was still rolling at 0.25 m/s.
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      BaseObstacle.scale: 0.02
      # PathAlign/GoalAlign weighted up: with a forward-only sensor the robot
      # must stay on the planned path rather than cut corners into blind space.
      PathAlign.scale: 34.0
      PathAlign.forward_point_distance: 0.20
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.20
      PathDist.scale: 34.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.5
      footprint: "[ [0.55, 0.36], [0.55, -0.36], [-0.55, -0.36], [-0.55, 0.36] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_scan
        depth_scan:
          topic: scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          # The D435 is trustworthy from ~0.4 m to ~6 m in this sim.
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.75
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      transform_tolerance: 0.5
      # Unknown space must stay distinguishable -- the frontier explorer keys off it.
      track_unknown_space: true
      footprint: "[ [0.55, 0.36], [0.55, -0.36], [-0.55, -0.36], [-0.55, 0.36] ]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # RTAB-Map's projected occupancy grid, republished as it grows.
        #
        # This MUST be the fully-qualified topic.  StaticLayer is a plugin
        # inside the global_costmap node, so a relative "map" resolves against
        # that node's own namespace and becomes /a200_0000/global_costmap/map
        # -- a topic nothing publishes.  The costmap then stays 100% unknown
        # and every plan fails.  Unlike "scan", which the obstacle layer joins
        # with the parent namespace, the static layer does no such joining.
        map_topic: /a200_0000/map
        # RTAB-Map publishes the full grid each cycle and does NOT publish
        # /map_updates, so leave this off or the layer waits for updates that
        # never arrive.
        subscribe_to_updates: false
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_scan
        depth_scan:
          topic: scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.75
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      # Essential while exploring: frontier goals are next to unmapped cells.
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    # Spinning is the useful recovery here: it is also how the robot fills in the
    # 288 deg the camera cannot see.
    # Recovery spins are the most odometry-hostile motion the robot makes, so
    # keep them at the teleop turn rate rather than the old 0.8 rad/s.
    max_rotational_vel: 0.25
    min_rotational_vel: 0.10
    rotational_acc_lim: 2.5

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Final ceiling on everything Nav2 commands, matched to numpad_teleop.
    # This is the backstop: even if a controller asks for more, nothing faster
    # than 0.40 m/s or 0.25 rad/s reaches the wheels.
    max_velocity: [0.40, 0.0, 0.25]
    min_velocity: [-0.15, 0.0, -0.25]
    max_accel: [1.5, 0.0, 2.5]
    max_decel: [-1.5, 0.0, -2.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
